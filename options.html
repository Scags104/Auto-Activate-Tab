<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Auto-Activate New Tabs — Options</title>
  <style>
    :root {
      --bg: #15161a;
      --surface: #1c1e24;
      --surface-raised: #24262e;
      --border: #2c2f38;
      --text: #ecebe7;
      --text-muted: #8b8d96;
      --accent: #f5a623;
      --accent-soft: rgba(245, 166, 35, 0.16);
      --success: #6ee7b7;
      --danger: #e2685a;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    .card {
      width: 100%;
      max-width: 360px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 28px 24px 22px;
    }

    /* --- signature illustration: two overlapping browser tabs --- */
    .hero {
      display: flex;
      justify-content: center;
      margin-bottom: 6px;
    }

    .tabs-illustration {
      width: 96px;
      height: 56px;
      overflow: visible;
    }

    .tabs-illustration .tab {
      transition: fill 0.25s ease, transform 0.25s ease;
    }

    .tabs-illustration .tab.back {
      fill: var(--surface-raised);
      stroke: var(--border);
      stroke-width: 1;
    }

    .tabs-illustration .tab.front {
      fill: var(--accent-soft);
      stroke: var(--accent);
      stroke-width: 1.25;
    }

    .tabs-illustration .spotlight {
      fill: var(--accent);
      transition: r 0.25s ease, opacity 0.25s ease;
    }

    .card.pulsing .tabs-illustration .spotlight {
      r: 5;
      opacity: 0.55;
    }

    h1 {
      font-size: 17px;
      font-weight: 650;
      text-align: center;
      margin: 4px 0 2px;
      letter-spacing: -0.01em;
    }

    .tagline {
      text-align: center;
      color: var(--text-muted);
      font-size: 12.5px;
      margin: 0 0 22px;
    }

    /* --- rows --- */
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 0;
      border-top: 1px solid var(--border);
    }

    .row-label {
      font-size: 13.5px;
      font-weight: 550;
    }

    /* --- switch --- */
    .switch {
      appearance: none;
      border: none;
      width: 40px;
      height: 24px;
      border-radius: 999px;
      background: var(--border);
      position: relative;
      cursor: pointer;
      padding: 0;
      transition: background 0.18s ease;
      flex-shrink: 0;
    }

    .switch .knob {
      position: absolute;
      top: 3px;
      left: 3px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--text);
      transition: transform 0.18s ease;
    }

    .switch[aria-checked="true"] {
      background: var(--accent);
    }

    .switch[aria-checked="true"] .knob {
      transform: translateX(16px);
      background: #1a1a1a;
    }

    .switch:focus-visible,
    .tab-option:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    /* --- section --- */
    .section {
      padding-top: 14px;
      border-top: 1px solid var(--border);
    }

    .section-label {
      display: block;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    /* --- tab-shaped segmented control: mirrors real browser tabs --- */
    .tab-select {
      display: flex;
      gap: 4px;
    }

    .tab-option {
      flex: 1;
      appearance: none;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text-muted);
      font-size: 12.5px;
      font-weight: 550;
      padding: 9px 6px 8px;
      cursor: pointer;
      border-radius: 8px 8px 4px 4px;
      border-bottom-width: 3px;
      transition: all 0.15s ease;
    }

    .tab-option kbd {
      font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
      font-size: 10.5px;
      background: none;
      border: none;
      padding: 0;
    }

    .tab-option[aria-checked="true"] {
      background: var(--surface-raised);
      color: var(--text);
      border-color: var(--accent);
      border-bottom-color: var(--accent);
      transform: translateY(-1px);
    }

    .hint {
      color: var(--text-muted);
      font-size: 11.5px;
      line-height: 1.5;
      margin: 12px 2px 0;
    }

    .hint kbd {
      font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
      background: var(--surface-raised);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 1px 5px;
      font-size: 10.5px;
      color: var(--text);
    }

    .status {
      margin-top: 14px;
      font-size: 12px;
      height: 16px;
      color: var(--success);
      text-align: center;
    }

    .status.error {
      color: var(--danger);
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        transition: none !important;
      }
    }
  </style>
</head>
<body>
  <div class="card" id="card">
    <div class="hero" aria-hidden="true">
      <svg class="tabs-illustration" viewBox="0 0 120 70" xmlns="http://www.w3.org/2000/svg">
        <path class="tab back"
              d="M12,48 h38 a6,6 0 0 0 6,-6 v-16 a6,6 0 0 0 -6,-6 h-38 a6,6 0 0 0 -6,6 v16 a6,6 0 0 0 6,6 z" />
        <path class="tab front"
              d="M46,60 h50 a7,7 0 0 0 7,-7 v-22 a7,7 0 0 0 -7,-7 h-50 a7,7 0 0 0 -7,7 v22 a7,7 0 0 0 7,7 z" />
        <circle class="spotlight" cx="71" cy="34" r="3.5" />
      </svg>
    </div>

    <h1>Auto-Activate New Tabs</h1>
    <p class="tagline">Jump straight to the tab you just opened.</p>

    <div class="row">
      <span class="row-label">Extension</span>
      <button type="button" class="switch" id="enabled" role="switch" aria-checked="true" aria-label="Enable extension">
        <span class="knob"></span>
      </button>
    </div>

    <div class="section">
      <span class="section-label">Activate when</span>
      <div class="tab-select" role="radiogroup" aria-label="Activation mode">
        <button type="button" class="tab-option" id="mode-always" role="radio" aria-checked="true">Always</button>
        <button type="button" class="tab-option" id="mode-shift" role="radio" aria-checked="false">Only <kbd>⇧</kbd></button>
      </div>
      <p class="hint">
        <strong>Always</strong> switches to every new background tab, e.g.
        <kbd>middle-click</kbd> or <kbd>Ctrl</kbd>+click on a link.
        <strong>Only ⇧</strong> requires holding Shift too, e.g.
        <kbd>⇧</kbd>+middle-click or <kbd>Ctrl</kbd>+<kbd>⇧</kbd>+click.
      </p>
    </div>

    <div class="status" id="status" role="status" aria-live="polite"></div>
  </div>

  <script src="options.js"></script>
</body>
</html>
